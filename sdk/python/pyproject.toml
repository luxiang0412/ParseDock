[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parsedock"
version = "0.1.0"
description = "Python client for the ParseDock document-parsing API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
async = ["httpx>=0.27"]

[project.scripts]
parsedock = "parsedock_sdk.cli:main"

[tool.setuptools]
packages = ["parsedock_sdk"]
