[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parsedock"
version = "0.1.1"
description = "Python client for the ParseDock document-parsing API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "ParseDock maintainers"}]
keywords = ["document-parsing", "ocr", "pdf", "docx", "xlsx", "markdown", "document-ir"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/luxiang0412/ParseDock"
Documentation = "https://github.com/luxiang0412/ParseDock/blob/main/docs/SDK.md"
Changelog = "https://github.com/luxiang0412/ParseDock/blob/main/docs/CHANGELOG.md"
Issues = "https://github.com/luxiang0412/ParseDock/issues"

[project.scripts]
parsedock = "parsedock_sdk.cli:main"

[tool.setuptools]
packages = ["parsedock_sdk"]
