  securitySchemes:
    bearerAuth:
      description: |
        API token mapped to a stable owner id server-side. Keys are stored only as
        SHA-256 hashes (`--api-keys-file`); plaintext entries are hashed at startup
        and never logged.

        Each key carries scopes:
        * `jobs:write` — `POST /v1/jobs`, `POST /v1/parse`
        * `jobs:read` — `GET /v1/jobs/{id}`, `/result`, `/events`
        * `jobs:ack` — `POST /v1/jobs/{id}/ack`, `/cancel`

        A missing scope returns `403 insufficient_scope`. Keys without an explicit
        scope list (legacy `token:owner` form) hold all three.

        Plaintext keys must be at least 16 characters (32+ recommended). Repeated
        authentication failures from one client address are answered with
        `429 rate_limited` (`Retry-After`) before the token is looked at.
      scheme: bearer
      type: http
    apiKeyAuth:
      description: |
        The same API token as `bearerAuth`, for clients that cannot set an
        `Authorization` header. It is read only when no bearer token is sent; scopes
        and limits are identical.
      in: header
      name: X-Api-Key
      type: apiKey

