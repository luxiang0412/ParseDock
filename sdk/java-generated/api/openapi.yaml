openapi: 3.1.0
info:
  description: |
    ParseDock converts documents (PDF, DOCX, XLSX, PPTX, CSV/TSV, TXT/Markdown,
    PNG/JPEG/WebP) into a structured Document IR plus derived Markdown/Text.

    Lifecycle in one paragraph: `POST /v1/jobs` uploads and queues a job and
    returns `202`; a worker parses it; the result is downloadable while
    `retention_status=active`. `POST /v1/jobs/{id}/ack` records the client's
    intent to release the result and returns `202` (`release_pending`); deletion
    is asynchronous. Without an ACK the result expires at `result_expires_at`.
    After release/expiry, downloads return `410 Gone` for a short tombstone
    window and `404` afterwards.

    **Never auto-ACK.** A `200` on a download means the bytes left the server,
    not that the client consumed them.

    Ownership: every job belongs to the owner derived from the bearer token.
    A job that belongs to somebody else is indistinguishable from a missing job
    (`404`) to avoid existence leaks.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: ParseDock
  version: 0.1.0
servers:
- description: Local API replica (any replica is equivalent)
  url: http://localhost:8080
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- description: Asynchronous parse jobs
  name: jobs
- description: Bounded synchronous parse
  name: sync
- description: Server-sent events
  name: events
- description: Liveness/readiness
  name: probes
paths:
  /v1/jobs:
    post:
      description: |
        `multipart/form-data`. Parts may arrive in **any order**: the file is
        streamed to the coordinator's staging area (never buffered in memory)
        while scalar fields are collected, and the job is created once the body
        has been read.

        Precedence for `mode`/`device`/`priority`/`ttl_seconds`/`idempotency_key`:
        query parameter → multipart field → default. The `Idempotency-Key`
        header wins over both.

        Upload limits are enforced server-side: size (`max_upload_mb`), page count
        (`max_pages`), archive expansion ratio, OOXML structure and PDF markers.
        The declared `Content-Type` of the file part is **not** trusted.
      operationId: createJob
      parameters:
      - $ref: "#/components/parameters/ModeQuery"
      - $ref: "#/components/parameters/DeviceQuery"
      - $ref: "#/components/parameters/TtlSecondsQuery"
      - description: Higher runs first within the same queue.
        explode: true
        in: query
        name: priority
        required: false
        schema:
          default: 0
          maximum: 100
          minimum: 0
          type: integer
        style: form
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/createJob_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: Job accepted and queued.
          headers:
            Location:
              description: Relative URL of the job resource.
              explode: false
              schema:
                type: string
              style: simple
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: "Idempotent replay — the existing job is returned, nothing\
            \ new was created."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "A GPU worker is required but none is registered, or the idempotency\
            \ key conflicts."
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Format not in the allow-list, or content does not match the\
            \ extension."
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Malformed, encrypted or structurally invalid document."
        "429":
          $ref: "#/components/responses/RateLimited"
        "507":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Storage below the safety watermark; retry later (existing results
            stay readable).
      summary: Upload a document and enqueue a parse job
      tags:
      - jobs
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /v1/jobs/{id}:
    get:
      description: |
        The authoritative view of a job. Use this instead of trusting the last
        SSE event: events are best-effort, the query is not.
      operationId: getJob
      parameters:
      - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: Current job state.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/CoordinatorDown"
      summary: "Job status, retention state and result availability"
      tags:
      - jobs
      x-accepts:
      - application/json
  /v1/jobs/{id}/result:
    get:
      description: |
        Streams the artifact and holds a **download lease** until the body is
        complete (renewed while streaming). An ACK during the stream does not
        truncate it; the cleaner waits for the lease to end before deleting.

        Response headers:
        * `ETag` — strong validator **of this representation** (`sha256` of the
          markdown/text/json bytes). Different formats have different ETags.
        * `X-Result-Version` — the manifest hash, identical for all three formats
          and the only value `POST /ack` accepts.
        * `Content-Length`, `X-Download-Lease`, `Vary: Accept-Encoding`.

        Conditional requests: send `If-None-Match` with a previously received
        `ETag` to get `304 Not Modified` (no body). Repeated downloads are
        allowed while `retention_status=active`.
      operationId: downloadResult
      parameters:
      - $ref: "#/components/parameters/JobId"
      - description: |
          `json` is the canonical Document IR (`doc-ir/0.1`); `markdown`/`text`
          are rendered from the IR.
        explode: true
        in: query
        name: format
        required: false
        schema:
          default: markdown
          enum:
          - markdown
          - md
          - text
          - json
          type: string
        style: form
      responses:
        "304":
          description: The client's `If-None-Match` matches the current artifact.
          headers:
            ETag:
              explode: false
              schema:
                type: string
              style: simple
            X-Result-Version:
              explode: false
              schema:
                type: string
              style: simple
        "200":
          content:
            text/markdown:
              schema:
                type: string
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentIR"
          description: The requested representation.
          headers:
            ETag:
              description: Strong validator of this representation (per-artifact sha256).
              explode: false
              schema:
                type: string
              style: simple
            X-Result-Version:
              description: "Manifest hash, identical for all formats; echo this in\
                \ the ACK."
              explode: false
              schema:
                type: string
              style: simple
            X-Download-Lease:
              explode: false
              schema:
                type: string
              style: simple
            Content-Length:
              explode: false
              schema:
                type: integer
              style: simple
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The result is not ready yet (job queued/running/failed).
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The result was released or expired (tombstone window).
      summary: Download a derived view of the committed result
      tags:
      - jobs
      x-accepts:
      - application/json
      - text/markdown
      - text/plain
  /v1/jobs/{id}/ack:
    post:
      description: |
        Idempotent. The first ACK must carry the `result_version` that was
        downloaded (mismatch → `409`, nothing is released). The response means
        "release intent accepted"; poll `GET /v1/jobs/{id}` until
        `retention_status` is `released`.

        After a successful ACK, new downloads return `410` while in-flight
        downloads keep their lease. Repeat ACKs return `202` again and affect
        nothing else.
      operationId: ackJob
      parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ackJob_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ackJob_202_response"
          description: Release accepted (not necessarily deleted yet).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: result_version does not match the current result.
      summary: "Accept that the client consumed the result, release storage asynchronously"
      tags:
      - jobs
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/jobs/{id}/cancel:
    post:
      description: |
        Best effort and idempotent for `queued`/`running` jobs: the job becomes
        `cancelled` immediately and `cancel_requested_at` is recorded; the worker
        sees `cancelled` on its next heartbeat (default 10 s), aborts the engine
        process and finalises cleanly. Files are removed by the normal retention
        path. A cancelled job never publishes a result, even if the engine finished
        in the meantime.

        A **completed** job cannot be cancelled: the call returns `409` and nothing
        is released. Releasing a result is ACK's job and only ACK carries the
        "I stored these bytes" claim - a second release path made the outcome
        depend on a race between cancel and ACK.
      operationId: cancelJob
      parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cancelJob_202_response"
          description: Cancellation accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Job already completed - use `POST /v1/jobs/{id}/ack` to release\
            \ the result."
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Stop a queued/running job (completed results must be ACKed)
      tags:
      - jobs
      x-accepts:
      - application/json
  /v1/jobs/{id}/events:
    get:
      description: |
        `text/event-stream`. A `snapshot` event is always sent first, then the
        lifecycle events.

        Subscription scope:
        * `scope=processing` (default) — events up to the terminal **processing**
          status (`completed`/`failed`/`cancelled`); the stream then ends with
          `stream_end`. Retention events are not delivered in this scope.
        * `scope=retention` — continues into the retention lifecycle
          (`release_pending`, `released`, `expired`) until it is terminal or the
          stream hits its 10 minute cap (`stream_end` with
          `reason=max_duration`).

        Reconnect with `Last-Event-ID` (or `?last_event_id=`) to resume. Event
        rows are deleted with the job after the tombstone window (default
        10 min), so a cursor older than the retained window receives a
        `cursor_reset` event followed by a fresh `snapshot` — never a silent gap.
        The final answer is always `GET /v1/jobs/{id}`.
      operationId: jobEvents
      parameters:
      - $ref: "#/components/parameters/JobId"
      - description: How far into the lifecycle the stream follows the job.
        explode: true
        in: query
        name: scope
        required: false
        schema:
          default: processing
          enum:
          - processing
          - retention
          type: string
        style: form
      - explode: false
        in: header
        name: Last-Event-ID
        required: false
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: last_event_id
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: |
                  Frames contain `id:`, `event:` and `data:` (JSON with
                  `event_id`, `event_type`, `job_id`, `payload`, `created_at`).
                type: string
          description: Event stream.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Server-sent events for one job
      tags:
      - events
      x-accepts:
      - application/json
      - text/event-stream
  /v1/parse:
    post:
      description: |
        Same validation and pipeline as `POST /v1/jobs`, but waits up to
        `timeout_ms` (default 30 s, max 2 min) for completion.
        * finished → `200` with the Document IR;
        * deadline reached → `202` with the job resource; it keeps running asynchronously;
        * failure → `422` with the stable error code.

        The result is **not released** by this call: a written response does not
        prove the caller received it, so the normal TTL applies. The response
        carries `X-Job-Id` and `X-Result-Version`; release with
        `POST /v1/jobs/{id}/ack` when your sink has the bytes. Intended for
        interactive callers; prefer `/v1/jobs` for anything large.
      operationId: parseSync
      parameters:
      - $ref: "#/components/parameters/ModeQuery"
      - $ref: "#/components/parameters/DeviceQuery"
      - explode: true
        in: query
        name: timeout_ms
        required: false
        schema:
          default: 30000
          maximum: 120000
          minimum: 100
          type: integer
        style: form
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/parseSync_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentIR"
          description: Parsed document (IR).
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: Still running; the job continues in the background.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Parse failed or the document is unsupported.
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: Bounded synchronous parse (small documents)
      tags:
      - sync
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/healthz_200_response"
          description: Process is serving.
      security: []
      summary: Liveness
      tags:
      - probes
      x-accepts:
      - application/json
  /readyz:
    get:
      description: |
        Returns `503` when SQLite is down or the cleaner has stalled. A low disk
        watermark keeps the service `ready` (reads and ACKs must keep working) but
        reports `accepting_uploads=false`.

        The probe is unauthenticated, so `checks` carries verdicts only (`sqlite`,
        `storage`, `cleanup`, `accepting_uploads`). Free bytes, the last cleanup
        time and error details are available to operators on the coordinator's
        internal listener with the internal token, and as metrics.
      operationId: readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
          description: Ready.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
          description: Not ready.
      security: []
      summary: Readiness (delegated to the coordinator)
      tags:
      - probes
      x-accepts:
      - application/json
components:
  parameters:
    JobId:
      example: job_06GRQJT5HC1DDZMPWRSKSCKM24
      explode: false
      in: path
      name: id
      required: true
      schema:
        pattern: "^job_[0-9A-HJKMNP-TV-Z]{26}$"
        type: string
      style: simple
    ModeQuery:
      description: |
        A **policy preference, not a per-document accuracy guarantee**:

        * `fast` — fastest engine that can read the format (xberg for PDF/Office).
        * `accurate` — requires an engine that declares structured output
          (docling-rs: reading order, bbox, table spans, sheet names).
        * `auto` — router picks by priority and records why.

        Text formats (`txt`, `md`, `csv`, `tsv`) always use the native engine in
        every mode: it is orders of magnitude faster and decodes GB18030/UTF-16
        correctly, which the ML engines do not. Measured counter-examples where
        `accurate` is *not* more accurate (OCR-heavy scans, DOCX/XLSX text) are
        documented in `docs/ENGINE-BENCHMARK.md`; the engine, version and reason
        are always recorded in the job and the IR.
      explode: true
      in: query
      name: mode
      required: false
      schema:
        default: auto
        enum:
        - auto
        - fast
        - accurate
        type: string
      style: form
    DeviceQuery:
      description: |
        `gpu_required` is rejected with `409 gpu_unavailable` when no GPU worker
        is registered — it never silently runs on CPU. `gpu_preferred` may fall
        back to CPU, and the result marks the actual device.
      explode: true
      in: query
      name: device
      required: false
      schema:
        default: auto
        enum:
        - auto
        - cpu
        - gpu_preferred
        - gpu_required
        type: string
      style: form
    TtlSecondsQuery:
      description: "Requested result TTL, capped by the server's maximum."
      explode: true
      in: query
      name: ttl_seconds
      required: false
      schema:
        minimum: 1
        type: integer
      style: form
    IdempotencyKeyHeader:
      description: Same key + same owner returns the original job (`200`) instead
        of creating a second one.
      explode: false
      in: header
      name: Idempotency-Key
      required: false
      schema:
        maxLength: 200
        type: string
      style: simple
  responses:
    RateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: |
        Per-owner limits. `rate_limited` = request-rate budget (all requests,
        including status polling and event streams); `quota_exceeded` = concurrent
        jobs, jobs/day or bytes/day for this owner. Both carry `Retry-After` in
        seconds. Retrying `rate_limited` after that delay is expected; retrying
        `quota_exceeded` is not - the quota only resets when its window passes.
      headers:
        Retry-After:
          explode: false
          schema:
            type: integer
          style: simple
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Invalid parameters.
    InsufficientScope:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: The API key is valid but does not grant the scope this operation
        needs.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Missing/invalid token.
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "Unknown job, or a job owned by somebody else."
    TooLarge:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Upload exceeds the configured limit.
    CoordinatorDown:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: The coordinator is unreachable (API replicas stay healthy).
  schemas:
    Error:
      example:
        error:
          code: gone
          message: result released or expired
      properties:
        error:
          $ref: "#/components/schemas/Error_error"
      required:
      - error
    Job:
      example:
        job_id: job_06GRQJT5HC1DDZMPWRSKSCKM24
        status: completed
        processing_status: completed
        retention_status: active
        input_name: invoice.pdf
        format: pdf
        mime_type: application/pdf
        input_size: 4855
        input_sha256: 2afddc70afb333ed62006821b7d5b4aebbe5a05cad40527cb61e618907abedfd
        page_count: 3
        created_at: 2026-10-30T07:51:18.412Z
        completed_at: 2026-10-30T07:51:31.006Z
        result_expires_at: 2026-10-30T08:51:31.006Z
        max_lifetime_at: 2026-10-31T07:51:18.412Z
        attempt: 1
        requested_mode: fast
        requested_device: auto
        engine: xberg
        routing_reason: format=pdf mode=fast device=auto -> xberg/xberg (cpu)
        progress_percent: 100
        progress_stage: completed
        result_version: sha256:1f2c…
        result_urls:
          markdown: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24/result?format=markdown
          text: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24/result?format=text
          json: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24/result?format=json
        status_url: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24
        events_url: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24/events
        ack_url: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24/ack
        cancel_url: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24/cancel
      properties:
        job_id:
          example: job_06GRQJT5HC1DDZMPWRSKSCKM24
          type: string
        status:
          description: Processing dimension.
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
          type: string
        processing_status:
          deprecated: true
          description: Alias of `status` (both are returned).
          type: string
        retention_status:
          description: "Retention dimension, independent of `status`."
          enum:
          - active
          - release_pending
          - expiry_pending
          - deleting
          - released
          - expired
          type: string
        input_name:
          type: string
        format:
          example: pdf
          type: string
        mime_type:
          type: string
        input_size:
          format: int64
          type: integer
        input_sha256:
          type: string
        page_count:
          description: Engine-reported when available
          type: integer
        created_at:
          format: date-time
          type: string
        started_at:
          format: date-time
          type: string
        completed_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
        result_expires_at:
          description: "TTL measured from result commit, not upload."
          format: date-time
          nullable: true
          type: string
        processing_deadline_at:
          description: |
            Deadline for **queued/running** work only (created + max_job_lifetime).
            It does not bound a completed result: retention is governed by
            `result_expires_at`.
          format: date-time
          type: string
        max_lifetime_at:
          deprecated: true
          description: Deprecated alias of `processing_deadline_at` (same value).
          format: date-time
          type: string
        attempt:
          type: integer
        requested_mode:
          type: string
        requested_device:
          type: string
        engine:
          description: Engine that actually produced the result
          type: string
        routing_reason:
          description: Human-readable routing decision
          type: string
        progress_percent:
          maximum: 100
          minimum: 0
          type: integer
        progress_stage:
          type: string
