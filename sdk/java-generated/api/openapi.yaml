openapi: 3.1.0
info:
  description: |
    ParseDock converts documents (PDF, DOCX, XLSX, PPTX, CSV/TSV, TXT/Markdown,
    PNG/JPEG/WebP) into a structured Document IR plus derived Markdown/Text.

    Lifecycle in one paragraph: `POST /v1/jobs` uploads and queues a job and
    returns `202`; a worker parses it; the result is downloadable while
    `retention_status=active`. `POST /v1/jobs/{id}/ack` records the client's
    intent to release the result and returns `202` (`release_pending`); deletion
    is asynchronous. Without an ACK the result expires at `result_expires_at`.
    After release/expiry, downloads return `410 Gone` for a short tombstone
    window and `404` afterwards.

    **Never auto-ACK.** A `200` on a download means the bytes left the server,
    not that the client consumed them.

    Ownership: every job belongs to the owner derived from the bearer token.
    A job that belongs to somebody else is indistinguishable from a missing job
    (`404`) to avoid existence leaks.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: ParseDock
  version: 0.1.0
servers:
- description: Local API replica (any replica is equivalent)
  url: http://localhost:8080
security:
- bearerAuth: []
tags:
- description: Asynchronous parse jobs
  name: jobs
- description: Bounded synchronous parse
  name: sync
- description: Server-sent events
  name: events
- description: Liveness/readiness
  name: probes
- description: "Worker protocol (private network only, never exposed publicly)"
  name: internal
paths:
  /v1/jobs:
    post:
      description: |
        `multipart/form-data`. Put scalar fields **before** the `file` part; the
        implementation streams the file as soon as it encounters it (no full-body
        buffering). The same fields may instead be supplied as query parameters,
        which take precedence.

        Upload limits are enforced server-side: size (`max_upload_mb`), page count
        (`max_pages`), archive expansion ratio, OOXML structure and PDF markers.
        The declared `Content-Type` of the file part is **not** trusted.
      operationId: createJob
      parameters:
      - $ref: "#/components/parameters/ModeQuery"
      - $ref: "#/components/parameters/DeviceQuery"
      - $ref: "#/components/parameters/TtlSecondsQuery"
      - description: Higher runs first within the same queue.
        explode: true
        in: query
        name: priority
        required: false
        schema:
          default: 0
          maximum: 100
          minimum: 0
          type: integer
        style: form
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/createJob_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: Job accepted and queued.
          headers:
            Location:
              description: Relative URL of the job resource.
              explode: false
              schema:
                type: string
              style: simple
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: "Idempotent replay — the existing job is returned, nothing\
            \ new was created."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "A GPU worker is required but none is registered, or the idempotency\
            \ key conflicts."
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Format not in the allow-list, or content does not match the\
            \ extension."
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Malformed, encrypted or structurally invalid document."
        "429":
          $ref: "#/components/responses/RateLimited"
        "507":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Storage below the safety watermark; retry later (existing results
            stay readable).
      summary: Upload a document and enqueue a parse job
      tags:
      - jobs
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /v1/jobs/{id}:
    get:
      description: |
        The authoritative view of a job. Use this instead of trusting the last
        SSE event: events are best-effort, the query is not.
      operationId: getJob
      parameters:
      - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: Current job state.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CoordinatorDown"
      summary: "Job status, retention state and result availability"
      tags:
      - jobs
      x-accepts:
      - application/json
  /v1/jobs/{id}/result:
    get:
      description: |
        Streams the artifact and holds a **download lease** until the body is
        complete (renewed while streaming). An ACK during the stream does not
        truncate it; the cleaner waits for the lease to end before deleting.

        Response headers: `ETag` and `X-Result-Version` carry the manifest hash,
        `Content-Length` is always set, `X-Download-Lease` is the lease id.
        Repeated downloads are allowed while `retention_status=active`.
      operationId: downloadResult
      parameters:
      - $ref: "#/components/parameters/JobId"
      - description: |
          `json` is the canonical Document IR (`doc-ir/0.1`); `markdown`/`text`
          are rendered from the IR.
        explode: true
        in: query
        name: format
        required: false
        schema:
          default: markdown
          enum:
          - markdown
          - text
          - json
          type: string
        style: form
      responses:
        "200":
          content:
            text/markdown:
              schema:
                type: string
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentIR"
          description: The requested representation.
          headers:
            ETag:
              description: '"sha256:…" — identical to X-Result-Version.'
              explode: false
              schema:
                type: string
              style: simple
            X-Result-Version:
              description: Manifest hash the client must echo in the ACK.
              explode: false
              schema:
                type: string
              style: simple
            X-Download-Lease:
              explode: false
              schema:
                type: string
              style: simple
            Content-Length:
              explode: false
              schema:
                type: integer
              style: simple
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The result is not ready yet (job queued/running/failed).
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The result was released or expired (tombstone window).
      summary: Download a derived view of the committed result
      tags:
      - jobs
      x-accepts:
      - application/json
      - text/markdown
      - text/plain
  /v1/jobs/{id}/ack:
    post:
      description: |
        Idempotent. The first ACK must carry the `result_version` that was
        downloaded (mismatch → `409`, nothing is released). The response means
        "release intent accepted"; poll `GET /v1/jobs/{id}` until
        `retention_status` is `released`.

        After a successful ACK, new downloads return `410` while in-flight
        downloads keep their lease. Repeat ACKs return `202` again and affect
        nothing else.
      operationId: ackJob
      parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ackJob_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ackJob_202_response"
          description: Release accepted (not necessarily deleted yet).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: result_version does not match the current result.
      summary: "Accept that the client consumed the result, release storage asynchronously"
      tags:
      - jobs
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/jobs/{id}/cancel:
    post:
      description: |
        Best effort and idempotent. A running job is marked `cancelled`; the worker
        notices on its next heartbeat and aborts. Input files are cleaned up by the
        normal retention path.
      operationId: cancelJob
      parameters:
      - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cancelJob_202_response"
          description: Cancellation accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: "Stop a queued/running job, or release a completed result"
      tags:
      - jobs
      x-accepts:
      - application/json
  /v1/jobs/{id}/events:
    get:
      description: |
        `text/event-stream`. A `snapshot` event is sent first, then lifecycle
        events (`created`, `running`, `retry_scheduled`, `completed`, `failed`,
        `release_pending`, `lease_expired`, `released`, `expired`, `cancelled`).
        Reconnect with `Last-Event-ID` (or `?last_event_id=`) to resume.
        The stream ends with `stream_end` when the job reaches a terminal state;
        the final answer is always `GET /v1/jobs/{id}`.
      operationId: jobEvents
      parameters:
      - $ref: "#/components/parameters/JobId"
      - explode: false
        in: header
        name: Last-Event-ID
        required: false
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: last_event_id
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: |
                  Frames contain `id:`, `event:` and `data:` (JSON with
                  `event_id`, `event_type`, `job_id`, `payload`, `created_at`).
                type: string
          description: Event stream.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Server-sent events for one job
      tags:
      - events
      x-accepts:
      - application/json
      - text/event-stream
  /v1/parse:
    post:
      description: |
        Same validation and pipeline as `POST /v1/jobs`, but waits up to
        `timeout_ms` (default 30 s, max 2 min) for completion.
        * finished → `200` with the Document IR and the result is released immediately
          (the body was fully written, so no retention window is needed);
        * deadline reached → `202` with the job resource; it keeps running asynchronously;
        * failure → `422` with the stable error code.
        Intended for interactive callers; prefer `/v1/jobs` for anything large.
      operationId: parseSync
      parameters:
      - $ref: "#/components/parameters/ModeQuery"
      - $ref: "#/components/parameters/DeviceQuery"
      - explode: true
        in: query
        name: timeout_ms
        required: false
        schema:
          default: 30000
          maximum: 120000
          minimum: 100
          type: integer
        style: form
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/parseSync_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentIR"
          description: Parsed document (IR).
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: Still running; the job continues in the background.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Parse failed or the document is unsupported.
      summary: Bounded synchronous parse (small documents)
      tags:
      - sync
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/healthz_200_response"
          description: Process is serving.
      security: []
      summary: Liveness
      tags:
      - probes
      x-accepts:
      - application/json
  /readyz:
    get:
      description: |
        Returns `503` when SQLite is down or the cleaner has stalled. A low disk
        watermark keeps the service `ready` (reads and ACKs must keep working) but
        reports `accepting_uploads=false`.
      operationId: readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
          description: Ready.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
          description: Not ready.
      security: []
      summary: Readiness (delegated to the coordinator)
      tags:
      - probes
      x-accepts:
      - application/json
  /internal/workers/register:
    post:
      operationId: registerWorker
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerRegistration"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/registerWorker_200_response"
          description: Registered.
      security:
      - internalToken: []
      summary: Register worker capabilities
      tags:
      - internal
      x-content-type: application/json
      x-accepts:
      - application/json
  /internal/tasks/claim:
    post:
      operationId: claimTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/claimTask_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimedTask"
          description: A leased task.
        "204":
          description: Nothing to do.
      security:
      - internalToken: []
      summary: Atomically lease one matching queued job
      tags:
      - internal
      x-content-type: application/json
      x-accepts:
      - application/json
  /internal/tasks/{id}/input:
    get:
      operationId: fetchInput
      parameters:
      - $ref: "#/components/parameters/JobId"
      - explode: false
        in: header
        name: X-Lease-Token
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Raw input bytes.
          headers:
            X-Content-SHA256:
              explode: false
              schema:
                type: string
              style: simple
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Lease invalid or expired.
      security:
      - internalToken: []
      summary: Stream the input for a leased task
      tags:
      - internal
      x-accepts:
      - application/json
      - application/octet-stream
  /internal/tasks/{id}/heartbeat:
    post:
      operationId: taskHeartbeat
      parameters:
      - $ref: "#/components/parameters/JobId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/taskHeartbeat_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/taskHeartbeat_200_response"
          description: Lease renewed.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Lease lost or the job was cancelled.
      security:
      - internalToken: []
      summary: Renew the lease and report progress
      tags:
      - internal
      x-content-type: application/json
      x-accepts:
      - application/json
  /internal/tasks/{id}/result:
    put:
      description: |
        The coordinator renders Markdown/Text from the IR, writes artifacts
        atomically and commits the job only if the lease is still valid. A
        superseded attempt receives `409` and its files are discarded.
      operationId: submitResult
      parameters:
      - $ref: "#/components/parameters/JobId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/submitResult_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/submitResult_200_response"
          description: Result committed.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Lease expired/superseded — result rejected.
      security:
      - internalToken: []
      summary: Submit the Document IR (fenced commit)
      tags:
      - internal
      x-content-type: application/json
      x-accepts:
      - application/json
  /internal/tasks/{id}/fail:
    post:
      operationId: failTask
      parameters:
      - $ref: "#/components/parameters/JobId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/failTask_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/failTask_200_response"
          description: Failure recorded (job may have been requeued).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Lease lost.
      security:
      - internalToken: []
      summary: Report a classified failure
      tags:
      - internal
      x-content-type: application/json
      x-accepts:
      - application/json
components:
  parameters:
    JobId:
      example: job_06GRQJT5HC1DDZMPWRSKSCKM24
      explode: false
      in: path
      name: id
      required: true
      schema:
        pattern: "^job_[0-9A-HJKMNP-TV-Z]{26}$"
        type: string
      style: simple
    ModeQuery:
      description: |
        `fast` prefers native text extraction; `accurate` requires a structured
        engine; `auto` lets the router choose (and records the decision).
      explode: true
      in: query
      name: mode
      required: false
      schema:
        default: auto
        enum:
        - auto
        - fast
        - accurate
        type: string
      style: form
    DeviceQuery:
      description: |
        `gpu_required` is rejected with `409 gpu_unavailable` when no GPU worker
        is registered — it never silently runs on CPU. `gpu_preferred` may fall
        back to CPU, and the result marks the actual device.
      explode: true
      in: query
      name: device
      required: false
      schema:
        default: auto
        enum:
        - auto
        - cpu
        - gpu_preferred
        - gpu_required
        type: string
      style: form
    TtlSecondsQuery:
      description: "Requested result TTL, capped by the server's maximum."
      explode: true
      in: query
      name: ttl_seconds
      required: false
      schema:
        minimum: 1
        type: integer
      style: form
    IdempotencyKeyHeader:
      description: Same key + same owner returns the original job (`200`) instead
        of creating a second one.
      explode: false
      in: header
      name: Idempotency-Key
      required: false
      schema:
        maxLength: 200
        type: string
      style: simple
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Invalid parameters.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Missing/invalid token.
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "Unknown job, or a job owned by somebody else."
    TooLarge:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Upload exceeds the configured limit.
    RateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Per-owner rate limit exceeded.
      headers:
        Retry-After:
          explode: false
          schema:
            type: integer
          style: simple
    CoordinatorDown:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: The coordinator is unreachable (API replicas stay healthy).
  schemas:
    Error:
      example:
        error:
          code: gone
          message: result released or expired
      properties:
        error:
          $ref: "#/components/schemas/Error_error"
      required:
      - error
    Job:
      example:
        job_id: job_06GRQJT5HC1DDZMPWRSKSCKM24
        status: completed
        processing_status: completed
        retention_status: active
        input_name: invoice.pdf
        format: pdf
        mime_type: application/pdf
        input_size: 4855
        input_sha256: 2afddc70afb333ed62006821b7d5b4aebbe5a05cad40527cb61e618907abedfd
        page_count: 3
        created_at: 2026-10-30T07:51:18.412Z
        completed_at: 2026-10-30T07:51:31.006Z
        result_expires_at: 2026-10-30T08:51:31.006Z
        max_lifetime_at: 2026-10-31T07:51:18.412Z
        attempt: 1
        requested_mode: fast
        requested_device: auto
        engine: xberg
        routing_reason: format=pdf mode=fast device=auto -> xberg/xberg (cpu)
        progress_percent: 100
        progress_stage: completed
        result_version: sha256:1f2c…
        result_urls:
          markdown: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24/result?format=markdown
          text: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24/result?format=text
          json: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24/result?format=json
        status_url: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24
        events_url: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24/events
        ack_url: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24/ack
        cancel_url: /v1/jobs/job_06GRQJT5HC1DDZMPWRSKSCKM24/cancel
      properties:
        job_id:
          example: job_06GRQJT5HC1DDZMPWRSKSCKM24
          type: string
        status:
          description: Processing dimension.
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
          type: string
        processing_status:
          description: Alias of `status` (both are returned).
          type: string
        retention_status:
          description: "Retention dimension, independent of `status`."
          enum:
          - active
          - release_pending
          - expiry_pending
          - deleting
          - released
          - expired
          type: string
        input_name:
          type: string
        format:
          example: pdf
          type: string
        mime_type:
          type: string
        input_size:
          format: int64
          type: integer
        input_sha256:
          type: string
        page_count:
          description: Engine-reported when available
          type: integer
        created_at:
          format: date-time
          type: string
        started_at:
          format: date-time
          type: string
        completed_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
        result_expires_at:
          description: "TTL measured from result commit, not upload."
          format: date-time
          type: string
          nullable: true
        max_lifetime_at:
          format: date-time
          type: string
        attempt:
          type: integer
        requested_mode:
          type: string
        requested_device:
          type: string
        engine:
          description: Engine that actually produced the result
          type: string
        routing_reason:
          description: Human-readable routing decision
          type: string
        progress_percent:
          maximum: 100
          minimum: 0
          type: integer
        progress_stage:
          type: string
        result_version:
          description: Manifest hash; echo it in the ACK.
          type: string
