openapi: 3.1.0
info:
  title: ParseDock
  version: 0.1.0
  summary: Stateless document parsing service with explicit ACK/TTL lifecycle
  description: |
    ParseDock converts documents (PDF, DOCX, XLSX, PPTX, CSV/TSV, TXT/Markdown,
    PNG/JPEG/WebP) into a structured Document IR plus derived Markdown/Text.

    Lifecycle in one paragraph: `POST /v1/jobs` uploads and queues a job and
    returns `202`; a worker parses it; the result is downloadable while
    `retention_status=active`. `POST /v1/jobs/{id}/ack` records the client's
    intent to release the result and returns `202` (`release_pending`); deletion
    is asynchronous. Without an ACK the result expires at `result_expires_at`.
    After release/expiry, downloads return `410 Gone` for a short tombstone
    window and `404` afterwards.

    **Never auto-ACK.** A `200` on a download means the bytes left the server,
    not that the client consumed them.

    Ownership: every job belongs to the owner derived from the bearer token.
    A job that belongs to somebody else is indistinguishable from a missing job
    (`404`) to avoid existence leaks.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8080
    description: Local API replica (any replica is equivalent)
tags:
  - name: jobs
    description: Asynchronous parse jobs
  - name: sync
    description: Bounded synchronous parse
  - name: events
    description: Server-sent events
  - name: probes
    description: Liveness/readiness

security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /v1/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: Upload a document and enqueue a parse job
      description: |
        `multipart/form-data`. Parts may arrive in **any order**: the file is
        streamed to the coordinator's staging area (never buffered in memory)
        while scalar fields are collected, and the job is created once the body
        has been read.

        Precedence for `mode`/`device`/`priority`/`ttl_seconds`/`idempotency_key`:
        query parameter → multipart field → default. The `Idempotency-Key`
        header wins over both.

        Upload limits are enforced server-side: size (`max_upload_mb`), page count
        (`max_pages`), archive expansion ratio, OOXML structure and PDF markers.
        The declared `Content-Type` of the file part is **not** trusted.
      parameters:
        - $ref: '#/components/parameters/ModeQuery'
        - $ref: '#/components/parameters/DeviceQuery'
        - $ref: '#/components/parameters/TtlSecondsQuery'
        - name: priority
          in: query
          schema: { type: integer, minimum: 0, maximum: 100, default: 0 }
          description: Higher runs first within the same queue.
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The document. Required.
                mode:
                  type: string
                  enum: [auto, fast, accurate]
                  default: auto
                device:
                  type: string
                  enum: [auto, cpu, gpu_preferred, gpu_required]
                  default: auto
                ttl_seconds:
                  type: integer
                  minimum: 1
                  description: Requested result TTL; capped by the server maximum.
                idempotency_key:
                  type: string
                  description: Alternative to the Idempotency-Key header.
      responses:
        '202':
          description: Job accepted and queued.
          headers:
            Location:
              schema: { type: string }
              description: Relative URL of the job resource.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '200':
          description: Idempotent replay — the existing job is returned, nothing new was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '409':
          description: A GPU worker is required but none is registered, or the idempotency key conflicts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415':
          description: Format not in the allow-list, or content does not match the extension.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Malformed, encrypted or structurally invalid document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '507':
          description: Storage below the safety watermark; retry later (existing results stay readable).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/jobs/{id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: Job status, retention state and result availability
      description: |
        The authoritative view of a job. Use this instead of trusting the last
        SSE event: events are best-effort, the query is not.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Current job state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/CoordinatorDown' }

  /v1/jobs/{id}/result:
    get:
      tags: [jobs]
      operationId: downloadResult
      summary: Download a derived view of the committed result
      description: |
        Streams the artifact and holds a **download lease** until the body is
        complete (renewed while streaming). An ACK during the stream does not
        truncate it; the cleaner waits for the lease to end before deleting.

        Response headers:
        * `ETag` — strong validator **of this representation** (`sha256` of the
          markdown/text/json bytes). Different formats have different ETags.
        * `X-Result-Version` — the manifest hash, identical for all three formats
          and the only value `POST /ack` accepts.
        * `Content-Length`, `X-Download-Lease`, `Vary: Accept-Encoding`.

        Conditional requests: send `If-None-Match` with a previously received
        `ETag` to get `304 Not Modified` (no body). Repeated downloads are
        allowed while `retention_status=active`.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: format
          in: query
          schema:
            type: string
            enum: [markdown, md, text, json]
            default: markdown
          description: |
            `json` is the canonical Document IR (`doc-ir/0.1`); `markdown`/`text`
            are rendered from the IR.
      responses:
        '304':
          description: The client's `If-None-Match` matches the current artifact.
          headers:
            ETag: { schema: { type: string } }
            X-Result-Version: { schema: { type: string } }
        '200':
          description: The requested representation.
          headers:
            ETag:
              schema: { type: string }
              description: Strong validator of this representation (per-artifact sha256).
            X-Result-Version:
              schema: { type: string }
              description: Manifest hash, identical for all formats; echo this in the ACK.
            X-Download-Lease:
              schema: { type: string }
            Content-Length:
              schema: { type: integer }
          content:
            text/markdown:
              schema: { type: string }
            text/plain:
              schema: { type: string }
            application/json:
              schema: { $ref: '#/components/schemas/DocumentIR' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '409':
          description: The result is not ready yet (job queued/running/failed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: The result was released or expired (tombstone window).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/jobs/{id}/ack:
    post:
      tags: [jobs]
      operationId: ackJob
      summary: Accept that the client consumed the result, release storage asynchronously
      description: |
        Idempotent. The first ACK must carry the `result_version` that was
        downloaded (mismatch → `409`, nothing is released). The response means
        "release intent accepted"; poll `GET /v1/jobs/{id}` until
        `retention_status` is `released`.

        After a successful ACK, new downloads return `410` while in-flight
        downloads keep their lease. Repeat ACKs return `202` again and affect
        nothing else.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result_version:
                  type: string
                  description: Manifest hash obtained from the download. Required for the first ACK.
                  example: 'sha256:3efdb500844b21355146bef8ba9e86ed8c5228a5661970cf3c291508d23d3fc0'
                action:
                  type: string
                  enum: [release]
                  default: release
              required: [result_version]
      responses:
        '202':
          description: Release accepted (not necessarily deleted yet).
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  retention_status:
                    type: string
                    enum: [release_pending, deleting, released, expired]
                  result_version: { type: string }
                  accepted_at: { type: string, format: date-time }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '409':
          description: result_version does not match the current result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/jobs/{id}/cancel:
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Stop a queued/running job (completed results must be ACKed)
      description: |
        Best effort and idempotent for `queued`/`running` jobs: the job becomes
        `cancelled` immediately and `cancel_requested_at` is recorded; the worker
        sees `cancelled` on its next heartbeat (default 10 s), aborts the engine
        process and finalises cleanly. Files are removed by the normal retention
        path. A cancelled job never publishes a result, even if the engine finished
        in the meantime.

        A **completed** job cannot be cancelled: the call returns `409` and nothing
        is released. Releasing a result is ACK's job and only ACK carries the
        "I stored these bytes" claim - a second release path made the outcome
        depend on a race between cancel and ACK.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string }
                  retention_status: { type: string }
                  result_version: { type: [string, 'null'] }
                  processing_deadline_at: { type: string, format: date-time }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Job already completed - use `POST /v1/jobs/{id}/ack` to release the result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/jobs/{id}/events:
    get:
      tags: [events]
      operationId: jobEvents
      summary: Server-sent events for one job
      description: |
        `text/event-stream`. A `snapshot` event is always sent first, then the
        lifecycle events.

        Subscription scope:
        * `scope=processing` (default) — events up to the terminal **processing**
          status (`completed`/`failed`/`cancelled`); the stream then ends with
          `stream_end`. Retention events are not delivered in this scope.
        * `scope=retention` — continues into the retention lifecycle
          (`release_pending`, `released`, `expired`) until it is terminal or the
          stream hits its 10 minute cap (`stream_end` with
          `reason=max_duration`).

        Reconnect with `Last-Event-ID` (or `?last_event_id=`) to resume. Event
        rows are deleted with the job after the tombstone window (default
        10 min), so a cursor older than the retained window receives a
        `cursor_reset` event followed by a fresh `snapshot` — never a silent gap.
        The final answer is always `GET /v1/jobs/{id}`.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: scope
          in: query
          schema: { type: string, enum: [processing, retention], default: processing }
          description: How far into the lifecycle the stream follows the job.
        - name: Last-Event-ID
          in: header
          schema: { type: string }
        - name: last_event_id
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Frames contain `id:`, `event:` and `data:` (JSON with
                  `event_id`, `event_type`, `job_id`, `payload`, `created_at`).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/parse:
    post:
      tags: [sync]
      operationId: parseSync
      summary: Bounded synchronous parse (small documents)
      description: |
        Same validation and pipeline as `POST /v1/jobs`, but waits up to
        `timeout_ms` (default 30 s, max 2 min) for completion.
        * finished → `200` with the Document IR;
        * deadline reached → `202` with the job resource; it keeps running asynchronously;
        * failure → `422` with the stable error code.

        The result is **not released** by this call: a written response does not
        prove the caller received it, so the normal TTL applies. The response
        carries `X-Job-Id` and `X-Result-Version`; release with
        `POST /v1/jobs/{id}/ack` when your sink has the bytes. Intended for
        interactive callers; prefer `/v1/jobs` for anything large.
      parameters:
        - $ref: '#/components/parameters/ModeQuery'
        - $ref: '#/components/parameters/DeviceQuery'
        - name: timeout_ms
          in: query
          schema: { type: integer, minimum: 100, maximum: 120000, default: 30000 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Parsed document (IR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentIR' }
        '202':
          description: Still running; the job continues in the background.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422':
          description: Parse failed or the document is unsupported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /healthz:
    get:
      tags: [probes]
      operationId: healthz
      security: []
      summary: Liveness
      responses:
        '200':
          description: Process is serving.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string }, role: { type: string } } }

  /readyz:
    get:
      tags: [probes]
      operationId: readyz
      security: []
      summary: Readiness (delegated to the coordinator)
      description: |
        Returns `503` when SQLite is down or the cleaner has stalled. A low disk
        watermark keeps the service `ready` (reads and ACKs must keep working) but
        reports `accepting_uploads=false`.

        The probe is unauthenticated, so `checks` carries verdicts only (`sqlite`,
        `storage`, `cleanup`, `accepting_uploads`). Free bytes, the last cleanup
        time and error details are available to operators on the coordinator's
        internal listener with the internal token, and as metrics.
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Not ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API token mapped to a stable owner id server-side. Keys are stored only as
        SHA-256 hashes (`--api-keys-file`); plaintext entries are hashed at startup
        and never logged.

        Each key carries scopes:
        * `jobs:write` — `POST /v1/jobs`, `POST /v1/parse`
        * `jobs:read` — `GET /v1/jobs/{id}`, `/result`, `/events`
        * `jobs:ack` — `POST /v1/jobs/{id}/ack`, `/cancel`

        A missing scope returns `403 insufficient_scope`. Keys without an explicit
        scope list (legacy `token:owner` form) hold all three.

        Plaintext keys must be at least 16 characters (32+ recommended). Repeated
        authentication failures from one client address are answered with
        `429 rate_limited` (`Retry-After`) before the token is looked at.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        The same API token as `bearerAuth`, for clients that cannot set an
        `Authorization` header. It is read only when no bearer token is sent; scopes
        and limits are identical.

  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$' }
      example: job_06GRQJT5HC1DDZMPWRSKSCKM24
    ModeQuery:
      name: mode
      in: query
      schema: { type: string, enum: [auto, fast, accurate], default: auto }
      description: |
        A **policy preference, not a per-document accuracy guarantee**:

        * `fast` — fastest engine that can read the format (xberg for PDF/Office).
        * `accurate` — requires an engine that declares structured output
          (docling-rs: reading order, bbox, table spans, sheet names).
        * `auto` — router picks by priority and records why.

        Text formats (`txt`, `md`, `csv`, `tsv`) always use the native engine in
        every mode: it is orders of magnitude faster and decodes GB18030/UTF-16
        correctly, which the ML engines do not. Measured counter-examples where
        `accurate` is *not* more accurate (OCR-heavy scans, DOCX/XLSX text) are
        documented in `docs/ENGINE-BENCHMARK.md`; the engine, version and reason
        are always recorded in the job and the IR.
    DeviceQuery:
      name: device
      in: query
      schema: { type: string, enum: [auto, cpu, gpu_preferred, gpu_required], default: auto }
      description: |
        `gpu_required` is rejected with `409 gpu_unavailable` when no GPU worker
        is registered — it never silently runs on CPU. `gpu_preferred` may fall
        back to CPU, and the result marks the actual device.
    TtlSecondsQuery:
      name: ttl_seconds
      in: query
      schema: { type: integer, minimum: 1 }
      description: Requested result TTL, capped by the server's maximum.
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 200 }
      description: Same key + same owner returns the original job (`200`) instead of creating a second one.

  responses:
    RateLimited:
      description: |
        Per-owner limits. `rate_limited` = request-rate budget (all requests,
        including status polling and event streams); `quota_exceeded` = concurrent
        jobs, jobs/day or bytes/day for this owner. Both carry `Retry-After` in
        seconds. Retrying `rate_limited` after that delay is expected; retrying
        `quota_exceeded` is not - the quota only resets when its window passes.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid parameters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InsufficientScope:
      description: The API key is valid but does not grant the scope this operation needs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing/invalid token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown job, or a job owned by somebody else.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooLarge:
      description: Upload exceeds the configured limit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CoordinatorDown:
      description: The coordinator is unreachable (API replicas stay healthy).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              enum:
                - invalid_request
                - unsupported_type
                - malformed_file
                - file_too_large
                - encrypted_file
                - page_limit_exceeded
                - suspicious_compression
                - expanded_too_large
                - quota_exceeded
                - insufficient_storage
                - engine_unavailable
                - gpu_unavailable
                - timeout
                - cancelled
                - internal_error
                - lease_lost
                - not_found
                - gone
                - conflict
                - unauthorized
                - insufficient_scope
                - rate_limited
                - coordinator_unavailable
            message: { type: string }
      example:
        error: { code: gone, message: 'result released or expired' }

    Job:
      type: object
      required: [job_id, status, retention_status, created_at, status_url]
      properties:
        job_id: { type: string, example: job_06GRQJT5HC1DDZMPWRSKSCKM24 }
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
          description: Processing dimension.
        processing_status:
          deprecated: true
          type: string
          description: Alias of `status` (both are returned).
        retention_status:
          type: string
          enum: [active, release_pending, expiry_pending, deleting, released, expired]
          description: Retention dimension, independent of `status`.
        input_name: { type: string }
        format: { type: string, example: pdf }
        mime_type: { type: string }
        input_size: { type: integer, format: int64 }
        input_sha256: { type: string }
        page_count: { type: integer, description: Engine-reported when available, pre-flight estimate otherwise }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        result_expires_at:
          type: [string, 'null']
          format: date-time
          description: TTL measured from result commit, not upload.
        processing_deadline_at:
          type: string
          format: date-time
          description: |
            Deadline for **queued/running** work only (created + max_job_lifetime).
            It does not bound a completed result: retention is governed by
            `result_expires_at`.
        max_lifetime_at:
          type: string
          format: date-time
          deprecated: true
          description: Deprecated alias of `processing_deadline_at` (same value).
        attempt: { type: integer }
        requested_mode: { type: string }
        requested_device: { type: string }
        engine: { type: string, description: Engine that actually produced the result }
        routing_reason: { type: string, description: Human-readable routing decision }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        progress_stage: { type: string }
        cancel_requested_at:
          type: [string, 'null']
          format: date-time
          description: |
            Set when cancellation was requested (queued/running jobs). The worker
            stops at its next heartbeat (default interval 10 s) and finalises the
            attempt; the job is already `cancelled` when this field appears.
        result_version:
          type: [string, 'null']
          description: Manifest hash; echo it in the ACK (`X-Result-Version`).
        result_urls:
          type: [object, 'null']
          properties:
            markdown: { type: string }
            text: { type: string }
            json: { type: string }
        warning_count: { type: integer }
        error_code: { type: string }
        error_message: { type: string }
        status_url: { type: string }
        events_url: { type: string }
        ack_url: { type: string }
        cancel_url: { type: string }
      example:
