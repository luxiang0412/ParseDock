openapi: 3.1.0
info:
  title: ParseDock Internal API
  version: 0.1.0
  summary: Worker protocol and diagnostics of the single Coordinator
  description: |
    **Private contract.** These endpoints live on the Coordinator's internal
    listener and are never exposed by the API replicas (the public gateway has no
    `/internal/*` route). Every request carries a credential in `X-Internal-Token`
    (see the `internalToken` scheme for which one); task-scoped endpoints
    additionally need the attempt's lease token (`X-Lease-Token` / `lease_token`),
    which is the fencing token.

    This document is separate from `api/openapi.yaml` on purpose (F06): generated
    SDKs must not contain worker operations. It is versioned with the service and
    validated in CI alongside the public spec.

    Delivery guarantees:
    * `claim` leases exactly one job atomically (`204` when nothing matches);
    * heartbeats renew the lease; a cancelled job answers `409 cancelled`, a lost
      lease answers `409 lease_lost`;
    * a result is committed only if the lease is still valid — a superseded
      attempt receives `409` and its files are discarded (fencing);
    * `fail` is idempotent for an already-cancelled attempt so the worker can
      always finish cleanly.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://127.0.0.1:8081
    description: Coordinator internal listener (private network only)
tags:
  - name: workers
    description: Registration and liveness
  - name: tasks
    description: Lease, input transfer, result submission
  - name: diagnostics
    description: Read-only inspection

security:
  - internalToken: []

paths:
  /internal/workers/register:
    post:
      tags: [workers]
      operationId: registerWorker
      summary: Register or refresh worker capabilities
      description: |
        `worker_id` is generated by the server when omitted. Registration must be
        refreshed at least every few minutes; a worker whose heartbeat is older
        than 3 minutes is not counted for `gpu_required` routing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerRegistration' }
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  worker_id: { type: string }
                  session_expires: { type: string, format: date-time }
                  heartbeat_every: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/workers/{id}/heartbeat:
    post:
      tags: [workers]
      operationId: workerHeartbeat
      summary: Refresh a worker registration (same body as register)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerRegistration' }
      responses:
        '200':
          description: Refreshed.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/tasks/claim:
    post:
      tags: [tasks]
      operationId: claimTask
      summary: Atomically lease one queued job matching the worker
      description: |
        Matching uses the worker's engine list, its device type and the job's
        `engine_hint`/`requested_device`. A `gpu_required` job is never offered to a
        worker without a GPU. The response contains the fencing token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                worker_id: { type: string }
                engines: { type: array, items: { type: string } }
                device_type: { type: string, enum: [cpu, gpu] }
      responses:
        '200':
          description: A leased task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimedTask' }
        '204':
          description: Nothing to do right now.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/tasks/{id}/input:
    get:
      tags: [tasks]
      operationId: fetchInput
      summary: Stream the input for a leased task
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: X-Lease-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Raw input bytes.
          headers:
            X-Content-SHA256:
              schema: { type: string }
              description: sha256 of the whole body; the worker must verify it.
            Content-Length:
              schema: { type: integer }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '409':
          description: Lease invalid, expired or superseded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: Input already removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/tasks/{id}/heartbeat:
    post:
      tags: [tasks]
      operationId: taskHeartbeat
      summary: Renew the lease and report progress
      description: |
        Returns `409 cancelled` when the client cancelled the job (the worker must
        stop and finalise; `fail` will succeed as a no-op) and `409 lease_lost` when
        the attempt is no longer running (expired or superseded). Progress writes are
        throttled to the heartbeat interval.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_token]
              properties:
                lease_token: { type: string }
                progress_percent: { type: integer, minimum: 0, maximum: 100 }
                stage: { type: string }
      responses:
        '200':
          description: Lease renewed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lease_until: { type: string, format: date-time }
                  renew_every: { type: string }
        '409':
          description: Lease lost or job cancelled (see `error.code`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/tasks/{id}/result:
    put:
      tags: [tasks]
      operationId: submitResult
      summary: Submit the Document IR (fenced commit)
      description: |
        The coordinator renders Markdown/Text from the IR, writes the artifacts
        atomically and commits the job only when `job.current_attempt` still matches
        the attempt that owns this `lease_token`. A late result from a superseded
        attempt gets `409` and the files it just wrote are deleted.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_token, document]
              properties:
                lease_token: { type: string }
                engine: { type: string }
                engine_version: { type: string }
                device_type: { type: string }
                page_count: { type: integer }
                document: { $ref: '#/components/schemas/DocumentIR' }
      responses:
        '200':
          description: Result committed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string }
                  result_version: { type: string }
                  result_expires_at: { type: [string, 'null'], format: date-time }
        '409':
          description: Lease expired/superseded — result rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/tasks/{id}/fail:
    post:
      tags: [tasks]
      operationId: failTask
      summary: Report a classified failure
      description: |
        A retryable failure with attempts left requeues the job with exponential
        backoff; otherwise the job becomes `failed`. For an attempt that was already
        cancelled this is an idempotent no-op returning the current job.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_token, code]
              properties:
                lease_token: { type: string }
                code:
                  type: string
                  description: |
                    Stable error code (`malformed_file`, `timeout`, `gpu_unavailable`, …). A code
                    outside the public error-code set is stored as `internal_error`.
                message: { type: string }
                retryable: { type: boolean }
      responses:
        '200':
          description: Failure recorded (job may have been requeued).
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string }
        '409':
          description: Lease lost.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/diagnostics/workers:
    get:
      tags: [diagnostics]
      operationId: listWorkers
      summary: List registered workers and their capabilities
      responses:
        '200':
          description: Registered workers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workers:
                    type: array
                    items: { $ref: '#/components/schemas/WorkerRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'The worker token was presented; this operator endpoint accepts only the internal token.' }

  /internal/metrics:
    get:
      tags: [operations]
      operationId: getMetrics
      summary: Prometheus text exposition
      description: |
        Counters, gauges and histograms in the Prometheus text format
        (`text/plain; version=0.0.4`). Database-derived gauges are computed at scrape
        time. Series names are documented in `docs/SLO.md`; no owner, job id, file name
        or document content ever appears in a label.
      responses:
        '200':
          description: Metrics exposition.
          content:
            text/plain:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'The worker token was presented; this operator endpoint accepts only the internal token.' }

  /internal/throttle:
    post:
      tags: [operations]
      operationId: reportThrottling
      summary: Aggregate rate-limit/quota refusals reported by API replicas
      description: |
        API replicas are stateless and have no scrape endpoint, so they batch their
        refusals here. Only the documented reasons are accepted; anything else is
        ignored, which keeps `parsedock_throttled_total` label values bounded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counts]
              properties:
                counts:
                  type: object
                  additionalProperties: { type: integer, format: int64, minimum: 0 }
      responses:
        '202': { description: Accepted for aggregation. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'The worker token was presented; this operator endpoint accepts only the internal token.' }

components:
  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: |
        Credential for the private coordinator network, sent in `X-Internal-Token`.
        Two values can be configured on the coordinator:

        * the **internal token** (`--internal-token`) — held by API replicas; the only
          credential that may assert an owner on `/v1` and the only one accepted by
          the operator endpoints (`/internal/metrics`, `/internal/diagnostics/*`,
          `/internal/throttle`), and the one that unlocks the detailed `/readyz` view;
        * the optional **worker token** (`--worker-token`) — held by workers; accepted
          on `/internal/workers/*` and `/internal/tasks/*` only. Presented anywhere
          else it is refused with `403`. For compatibility the worker routes keep
          accepting the internal token, and without a worker token every route
          behaves as with a single shared secret.

        Mutual TLS (`--tls-client-ca`, PR-07) authenticates the host underneath; the
        certificate's role is not checked against the token. The listener must stay
        on a private interface; the coordinator refuses to bind non-loopback without
        an internal token.

  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$' }

  responses:
    Unauthorized:
      description: Missing or invalid internal token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    WorkerRegistration:
      type: object
      required: [engines, device_type, max_concurrency]
      properties:
        worker_id: { type: string, description: Generated by the server when empty }
        host: { type: string }
        engines: { type: array, items: { type: string }, example: [native, xberg, docling-rs] }
        device_type: { type: string, enum: [cpu, gpu] }
        gpu_model: { type: string }
        gpu_memory_bytes: { type: integer, format: int64 }
        cpu_cores: { type: integer }
        memory_bytes: { type: integer, format: int64 }
        max_concurrency: { type: integer, minimum: 1 }

    ClaimedTask:
      type: object
      properties:
        job_id: { type: string }
        attempt_no: { type: integer }
        lease_token: { type: string, description: Fencing token for heartbeat/result/fail }
        lease_until: { type: string, format: date-time }
        format: { type: string }
        mime_type: { type: string }
        input_name: { type: string }
        input_sha256: { type: string }
        input_size: { type: integer, format: int64 }
        page_count: { type: integer }
        requested_mode: { type: string }
        requested_device: { type: string }
        engine_hint: { type: string }
        routing_reason: { type: string }
        max_lifetime_at:
          type: string
          format: date-time
          deprecated: true
          description: Deprecated alias of `processing_deadline_at`.
        processing_deadline_at: { type: string, format: date-time }

    DocumentIR:
      type: object
      description: |
        `doc-ir/0.1` (see docs/DOCUMENT-IR.md). The coordinator renders
        markdown/text from this and stores JSON verbatim. Fields the engine did not
        provide are absent, never invented.
      required: [schema_version, elements]
      properties:
        schema_version: { type: string, const: doc-ir/0.1 }
        parser_engine: { type: string }
        parser_version: { type: string }
        page_count: { type: integer }
        page_kind: { type: string, enum: [pdf, sheet, slide, none] }
        routing:
          type: object
          additionalProperties: true
        source:
          type: object
          additionalProperties: true
        elements:
          type: array
          items:
            type: object
            additionalProperties: true
        tables:
          type: array
          items:
            type: object
            additionalProperties: true
        warnings:
          type: array
          items: { type: object, additionalProperties: true }
        metrics:
          type: object
          additionalProperties: true
