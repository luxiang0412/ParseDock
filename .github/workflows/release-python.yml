# Publish the Python SDK to PyPI on a version tag.
#
# Uses Trusted Publishing (OIDC): no API token is stored in the repository. The
# matching publisher is configured on PyPI with
#   project: parsedock · owner: luxiang0412 · repo: ParseDock
#   workflow: release-python.yml · environment: pypi
# If the environment field on PyPI is left blank, delete `environment:` below and
# the PyPI publisher's environment field.
name: release-python

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # PyPI OIDC: no secret needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: build sdist and wheel
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: smoke-install the wheel
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install sdk/python/dist/*.whl
          /tmp/verify/bin/parsedock --version
          /tmp/verify/bin/python -c "import parsedock_sdk; print(parsedock_sdk.__version__)"
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: sdk/python/dist/
