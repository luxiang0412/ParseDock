name: Engine changes

# Extra verification for PRs that touch parsing engines, the worker image, the
# fixture corpus or the CI engine installer. It runs on every PR but skips fast
# when nothing relevant changed, so it can safely be a required check.
#
#   * engine/benchmark/fixture changes -> install xberg + docling-rs and run the
#     real-engine acceptance + quality subset (same phase as nightly).
#   * docker/deploy/compose changes    -> build the worker image and run the
#     container smoke test with real engines, plus SBOM evidence.

on:
  pull_request:

concurrency:
  group: engine-changes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  CGO_ENABLED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  detect:
    name: engine-changes/detect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      engines: ${{ steps.changed.outputs.engines }}
      containers: ${{ steps.changed.outputs.containers }}
      base_sha: ${{ steps.changed.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the three-dot diff below has a merge base even for
          # long-lived branches. The repository is small; this is cheaper and far
          # more reliable than a shallow fetch.
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        name: classify changed paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"
          git diff --name-only "${base}...HEAD" > /dev/null || {
            echo "cannot diff against ${base}; falling back to the PR base SHA" >&2
            git fetch --no-tags origin "${BASE_REF}"
          }
          files="$(git diff --name-only "${base}...HEAD")"
          echo "$files" | sed 's/^/changed: /'
          engines=false
          containers=false
          if echo "$files" | grep -qE '^(internal/engines/|benchmark/fixtures/|benchmark/scripts/(bench|gen_fixtures)\.py|scripts/ci-install-engines\.sh|engines\.lock\.json|images\.lock\.json)'; then
            engines=true
          fi
          if echo "$files" | grep -qE '^(docker/|deploy/|scripts/(container-smoke|license_audit)\.sh|Dockerfile)'; then
            containers=true
          fi
          echo "engines=$engines" >> "$GITHUB_OUTPUT"
          echo "containers=$containers" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse "${base}")" >> "$GITHUB_OUTPUT"

  real-engines:
    name: engine-changes/real-engines
    needs: detect
    if: needs.detect.outputs.engines == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: cache engine binaries and models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            runtime/engines/xberg-cli
            runtime/engines/docling-rs
          key: engines-${{ hashFiles('images.lock.json') }}
      - name: engines phase
        run: bash scripts/ci-local.sh engines
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-changes-real-engines
          path: build/ci/
          if-no-files-found: warn

  container:
    name: engine-changes/container
    needs: detect
    if: needs.detect.outputs.containers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: container phase
        run: bash scripts/ci-local.sh container
      - name: upload evidence + SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-changes-container
          path: build/ci/
          if-no-files-found: warn
