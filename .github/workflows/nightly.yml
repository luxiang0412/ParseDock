name: Nightly

# Real-engine verification and licence evidence (PR-01).
# Runs nightly, and on demand for engine-related work.

on:
  schedule:
    - cron: "30 18 * * *" # 02:30 Asia/Shanghai
  workflow_dispatch:
    inputs:
      repeats:
        description: "Benchmark repeats for the quality subset"
        default: "1"
        required: false
      engines:
        description: "Engines for acceptance-real"
        default: "native,xberg,docling-rs"
        required: false

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  CGO_ENABLED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  real-engines:
    name: real-engines
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: cache engine binaries and models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            runtime/engines/xberg-cli
            runtime/engines/docling-rs
          key: engines-${{ hashFiles('images.lock.json') }}
      - name: engines phase (install, acceptance-real, quality bench, score)
        run: bash scripts/ci-local.sh engines
      - name: upload real-engine evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-real-engines
          path: build/ci/
          if-no-files-found: warn

  sdks:
    name: sdk-check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: sdk-check (python e2e, CLI, version consistency, Java build)
        run: bash scripts/sdk-check.sh

  container:
    name: container-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: container phase (build both images, real-engine smoke, SBOM)
        # Plain `docker build` on purpose: the worker image is built FROM the
        # local control-plane image, which a buildx container driver cannot see.
        run: bash scripts/ci-local.sh container
      - name: upload container evidence + SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-container
          path: build/ci/
          if-no-files-found: warn
