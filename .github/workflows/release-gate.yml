name: Release gate

# Blocks publication of release artefacts while a licence finding is open (PR-01,
# requirement 7). There is intentionally no registry push step yet: PR-08/PR-12
# own publishing. This workflow is the gate those steps must pass through.
#
# Current expected state:
#   parsedock (control plane)         PASS
#   parsedock-worker-cpu              BLOCK  (libx265, legal item L1)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licence-gate:
    name: licence-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build both images (helper keeps the FROM relationship explicit)
        run: bash scripts/build-images.sh release
      - name: enforce licence gate (blocking)
        run: |
          set -euo pipefail
          mkdir -p build/release/sbom
          SBOM_DIR=build/release/sbom bash scripts/license_audit.sh \
            parsedock:release parsedock-worker-cpu:release
      - name: summary
        if: always()
        run: |
          {
            echo "## Release gate"
            echo
            echo "Licence audit is blocking for release tags. A BLOCK means the image"
            echo "must not be published (see docs/LICENSE-REVIEW.md item L1)."
            echo
            ls -la build/release/sbom 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: build/release/
          if-no-files-found: warn
