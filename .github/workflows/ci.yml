name: CI

# Blocking PR pipeline (PR-01). Every job runs the same commands as
# `scripts/ci-local.sh <phase>`, so a local `make ci` and CI cannot drift.
#
# Required checks (branch protection): static, unit, contract, lifecycle, image,
# ci-summary. Real-engine acceptance lives in nightly.yml + engine-changes.yml so
# the PR path stays under the 8 minute budget.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  CGO_ENABLED: "0"
  PYTHONUNBUFFERED: "1"
  # Pinned tool image; scripts/verify_pins.py fails if this drifts from
  # images.lock.json.
  OPENAPI_GENERATOR_IMAGE: openapitools/openapi-generator-cli@sha256:dbc745d3a93f7bbc4289155001ef8eba1474d9e34a0733e7baf32d78e8bb02d7

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: static phase (pins, fmt, vet, build, tidy drift)
        run: bash scripts/ci-local.sh static
      - name: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-static
          path: build/ci/
          if-no-files-found: warn

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: unit phase (go test + scoring rubric)
        run: bash scripts/ci-local.sh unit
      - name: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-unit
          path: build/ci/
          if-no-files-found: warn

  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: contract phase (specs, router/SDK drift, SDK regeneration)
        run: bash scripts/ci-local.sh contract
      - name: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-contract
          path: build/ci/
          if-no-files-found: warn

  lifecycle:
    name: lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: lifecycle phase (T03-T16, PR-00 runtime, backup/restore)
        run: bash scripts/ci-local.sh lifecycle
      - name: upload evidence (acceptance + PR-00 JSON, stack logs)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-lifecycle
          path: build/ci/
          if-no-files-found: warn

  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: image phase (build, self-check, reproducibility, licence report)
        run: bash scripts/ci-local.sh image
      - name: upload build summary (digest, repro hashes, SBOM)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image
          path: build/ci/
          if-no-files-found: warn

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install (lockfile-exact)
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: api types are generated from the public spec
        working-directory: web
        run: npm run api:types:check
      - name: lint
        working-directory: web
        run: npm run lint
      - name: typecheck
        working-directory: web
        run: npm run typecheck
      - name: unit tests
        working-directory: web
        run: npm test
      - name: build
        working-directory: web
        run: npm run build
      - name: no secrets in the bundle
        working-directory: web
        env:
          PARSEDOCK_DEV_KEY: ci-should-not-appear-in-dist
        run: node scripts/check-dist-secrets.mjs
      - name: bundle size report
        working-directory: web
        run: du -sh dist && ls -S dist/assets | head -5

  ci-summary:
    name: ci-summary
    if: always()
    needs: [static, unit, contract, lifecycle, image, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The gate logic lives in scripts/ci_summary.py, so this job needs the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: aggregate results (merge gate)
        # scripts/ci_summary.py is unit-tested; a substring grep here once let a
        # failing contract job pass the summary (see docs/PR01-REPORT.md §6).
        env:
          RESULTS: >-
            static=${{ needs.static.result }}
            unit=${{ needs.unit.result }}
            contract=${{ needs.contract.result }}
            lifecycle=${{ needs.lifecycle.result }}
            image=${{ needs.image.result }}
            web=${{ needs.web.result }}
        run: python3 scripts/ci_summary.py "$RESULTS" --github-summary "$GITHUB_STEP_SUMMARY"
