# Publish the Java client to Maven Central on a version tag.
#
# Requires, in the repository (Settings -> Secrets and variables -> Actions):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_TOKEN  Central Portal user token
#   GPG_PRIVATE_KEY                               ASCII-armored private key
#   MAVEN_GPG_PASSPHRASE                          key passphrase
# and a verified namespace on central.sonatype.com matching the POM groupId
# (com.luxiangs needs a DNS TXT record for luxiangs.com; io.github.luxiang0412
# is verified through the GitHub account instead).
#
# autoPublish=false: the deployment lands as a pending bundle in the Central
# Portal and is published by a human, so a bad tag cannot reach users.
name: release-maven

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: build, sign and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # setup-java writes ${env.MAVEN_CENTRAL_USERNAME} / ${env.MAVEN_CENTRAL_TOKEN}
    # into settings.xml; Maven resolves those placeholders from the process
    # environment, so the secrets have to be exported here (an environment secret
    # is not an env var by itself — that was the 401 on the first run).
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
    # The repository keeps its release secrets in the `pypi` environment (PyPI and
    # Maven together). Pointing both workflows at it means one approval gate and
    # no duplicated secrets; split into a dedicated `central` environment by
    # creating it, moving the four MAVEN_*/GPG_* secrets there and changing this
    # line.
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
      - name: import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
      - name: verify the signing key actually signs
        # "Bad passphrase" from the deploy step is unhelpful and only appears after
        # a 20 s build; prove the key/passphrase pair here instead.
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          test -n "$key" || { echo "no secret key imported"; exit 1; }
          echo "signing key: $key"
          if printf 'preflight' | gpg --batch --pinentry-mode loopback \
               --passphrase "$MAVEN_GPG_PASSPHRASE" -u "$key" --armor --detach-sign >/dev/null; then
            echo "signing OK"
          else
            echo "::error::MAVEN_GPG_PASSPHRASE does not match key $key (or the key is unusable)"
            exit 1
          fi
          # The passphrase comes from the environment: stdin carries the payload.
      - name: verify the POM carries release metadata
        run: |
          grep -q "<name>Apache License 2.0</name>" sdk/java-generated/pom.xml
          grep -q "<id>release</id>" sdk/java-generated/pom.xml
      - name: deploy to Maven Central (pending bundle)
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Prelease -DskipTests deploy -f sdk/java-generated/pom.xml
