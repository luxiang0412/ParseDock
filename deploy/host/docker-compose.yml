# Single-host ParseDock deployment: coordinator + 1 API replica + 1 CPU worker +
# the Playground (static app + same-origin /v1 proxy).
#
#   cp .env.example .env && edit it
#   docker compose up -d
#
# Published ports (change in .env):
#   8080  public API        (bearer key required)
#   8090  Playground UI     (proxies /v1 with the key injected server-side;
#                            bound to 127.0.0.1 unless PLAYGROUND_BIND is set)
#
# The coordinator's internal listener (8081) and the worker protocol are never
# published: they live on the `backend` network, which Docker marks internal.
name: parsedock

x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]

# Control-plane processes (coordinator, API) need no Linux capability.
x-control-plane: &control-plane
  <<: *common
  cap_drop: [ALL]

services:
  coordinator:
    <<: *control-plane
    image: ${PARSEDOCK_IMAGE:-parsedock:0.1.0}
    command:
      - --role=coordinator
      - --internal-listen=0.0.0.0:8081
      - --data-dir=/data
      - --engines=native,xberg,docling-rs
      - --result-ttl=${PARSEDOCK_RESULT_TTL:-1h}
      - --max-result-ttl=24h
      - --max-job-lifetime=24h
      - --max-upload-mb=${PARSEDOCK_MAX_UPLOAD_MB:-128}
      - --max-pages=${PARSEDOCK_MAX_PAGES:-2000}
      - --min-free-gb=2
      - --cleanup-interval=15s
      - --log-level=info
    environment:
      PARSEDOCK_INTERNAL_TOKEN: ${PARSEDOCK_INTERNAL_TOKEN:?set it in .env}
      PARSEDOCK_WORKER_TOKEN: ${PARSEDOCK_WORKER_TOKEN:?set it in .env (distinct from the internal token)}
    volumes:
      # SQLite + inputs + results. Must be a local disk, never NFS/SMB.
      - parsedock-data:/data
    networks: [backend]

  api:
    <<: *control-plane
    image: ${PARSEDOCK_IMAGE:-parsedock:0.1.0}
    command:
      - --role=api
      - --listen=0.0.0.0:8080
      - --coordinator-url=http://coordinator:8081
      - --max-upload-mb=${PARSEDOCK_MAX_UPLOAD_MB:-128}
      - --rate-limit=${PARSEDOCK_RATE_LIMIT:-200}
      - --rate-burst=${PARSEDOCK_RATE_BURST:-100}
    environment:
      PARSEDOCK_INTERNAL_TOKEN: ${PARSEDOCK_INTERNAL_TOKEN:?}
      PARSEDOCK_API_KEYS: ${PARSEDOCK_API_KEYS:?set <token>:<owner> in .env}
    ports: ["${API_PORT:-8080}:8080"]
    networks: [frontend, backend]
    depends_on: [coordinator]

  worker-cpu:
    # Deliberately not cap_drop: [ALL]: --sandbox=unshare-net needs namespace
    # capabilities. no-new-privileges still applies.
    <<: *common
    image: ${PARSEDOCK_WORKER_IMAGE:-parsedock-worker-cpu:0.1.0}
    command:
      - --role=worker
      - --coordinator-url=http://coordinator:8081
      - --engines=native,xberg,docling-rs
      - --worker-concurrency=${WORKER_CONCURRENCY:-2}
      - --device-type=cpu
      - --work-dir=/work
      - --heartbeat=10s
      - --max-parse-minutes=30
      # Must match the coordinator/api limit: the worker refuses inputs above its own
      # --max-upload-mb (default 64), so a 128 MiB upload would be accepted and then fail.
      - --max-upload-mb=${PARSEDOCK_MAX_UPLOAD_MB:-128}
      # OCR language: tesseract code. "zh" for Chinese scans, "eng" for Latin.
      # A wrong value does not fail the job, it silently degrades scanned text.
      - --xberg-ocr-lang=${PARSEDOCK_XBERG_OCR_LANG:-eng}
      # Empty is the default and means "let xberg use tesseract".
      - --xberg-ocr-backend=${PARSEDOCK_XBERG_OCR_BACKEND:-}
    environment:
      # The worker credential only: it opens the worker protocol, not /v1.
      PARSEDOCK_WORKER_TOKEN: ${PARSEDOCK_WORKER_TOKEN:?}
    # Scratch only; nothing a worker writes must survive the task.
    tmpfs:
      - /work:mode=1777,size=8g
    networks: [backend]
    depends_on: [coordinator]

  playground:
    <<: *common
    image: ${PARSEDOCK_PLAYGROUND_IMAGE:-parsedock-playground:0.1.0}
    # nginx's master runs as root and drops to the `nginx` user: it needs chown of the
    # cache dirs and setuid/setgid, nothing else.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /etc/nginx/conf.d:mode=1777
    environment:
      PARSEDOCK_API_UPSTREAM: http://api:8080
      # Injected as the bearer on every proxied /v1 request; never reaches the browser.
      PARSEDOCK_PROXY_TOKEN: ${PLAYGROUND_KEY:?set a dedicated token in .env}
      NGINX_PORT: "8080"
    # The injected key is full-scope for owner "playground": whoever reaches this port
    # acts as that owner. Loopback by default; PLAYGROUND_BIND=0.0.0.0 exposes it.
    ports: ["${PLAYGROUND_BIND:-127.0.0.1}:${PLAYGROUND_PORT:-8090}:8080"]
    # Only the public network: the UI must not reach the coordinator or workers.
    networks: [frontend]
    depends_on: [api]

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  parsedock-data: {}
